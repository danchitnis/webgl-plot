<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Webgl line plotting framework - Simple Straight Line</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>

  <body>
    <div class="items">
      <h1>45-Degree Line Demo</h1>
      <p>This demo shows a 45-degree line with 100 points ranging from 0.1 to 1.0 using WebGL thick line rendering.</p>
      <canvas class="canvas" id="myCanvas"></canvas>
      <div class="code-panel">
        <div class="code-panel-header">
          <strong>TypeScript</strong>
          <span id="runStatus" class="run-status">Ready</span>
        </div>
        <div id="tsEditor" class="code-editor" aria-label="TypeScript editor"></div>
      </div>
    </div>
  </body>

  <script type="module" src="./bench-straight-line.ts"></script>
</html>
