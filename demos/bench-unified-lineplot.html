<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Webgl line plotting framework - UnifiedLinePlot Benchmark</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>

  <body>
    <div>
      <canvas class="canvas" id="my_canvas"></canvas>
      <p><strong>UnifiedLinePlot</strong> - Dynamic lines with varying thicknesses</p>
      <p>Open the console (F12) for setup logs and thickness verification</p>
      <div style="margin: 10px 0; color: white;">
        <label for="minThickness">Min thickness:</label>
        <input type="number" id="minThickness" value="1" min="0.5" max="20" step="0.5" />
        <label for="maxThickness" style="margin-left: 8px;">Max thickness:</label>
        <input type="number" id="maxThickness" value="10" min="0.5" max="30" step="0.5" />
        <button id="applyThickness" class="button" style="margin-left: 8px;">Apply</button>
        <button id="randomThickness" class="button" style="margin-left: 4px;">Randomize</button>
        <p id="thicknessStatus" style="margin-top: 6px; color: #ccc;">Thickness range: 1 – 10</p>
      </div>
    </div>
  </body>

  <!--
    The benchmark TS files are typically compiled to JS in the same directory.
    The 'type="module"' allows using ES module syntax if the compiled output uses it.
    The tsconfig.json and vite/tsc compilation process determine the exact output format.
    For this project, direct .ts execution in browser might be handled by vite during dev,
    but for a static HTML, it should point to the compiled .js file.
    Let's assume the compilation process (e.g. `npx tsc ./demos/**/*.ts`) generates
    `./bench-unified-lineplot.js` which is an ES module.
  -->
  <script type="module" src="./bench-unified-lineplot.js"></script>
</html>
