<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebglPlot Unified Lineplot Tests</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      #errorDisplay p { color: red; }
      #successDisplay { color: green; font-weight: bold; }
      button { font-size: 1em; padding: 10px; margin-bottom: 20px;}
    </style>
  </head>
  <body>
    <h1>WebglPlot.createLinePlot() Unit Tests</h1>
    <p>Open the browser console to see detailed assertion logs.</p>
    <button onclick="runTests()">Run Tests</button>
    <canvas id="mockCanvas" width="100" height="100" style="display: none;"></canvas>
    <div id="errorDisplay"></div>
    <div id="successDisplay"></div>

    <!-- Load the main library bundle -->
    <!-- Adjust path if necessary based on your build output -->
    <script src="../dist/webglplot.js"></script>

    <!-- Load the compiled test script -->
    <!-- This will be generated by tsc -->
    <script src="test-unified-lineplot.js"></script>

    <script>
      function runTests() {
        document.getElementById('errorDisplay').innerHTML = '';
        document.getElementById('successDisplay').innerHTML = '';
        try {
          // The runAllTests function is exposed on the window object by test-unified-lineplot.ts
          if (window.runAllTests) {
            window.runAllTests();
          } else {
            console.error("Test runner function not found. Ensure test-unified-lineplot.js is loaded correctly.");
            document.getElementById('errorDisplay').textContent = "Test runner function not found.";
          }
        } catch (e) {
          console.error("Error during test execution:", e);
          const errorDisplay = document.getElementById("errorDisplay");
          const p = document.createElement("p");
          p.textContent = "An error occurred during test execution: " + e.message;
          errorDisplay.appendChild(p);
        }
      }
      // Automatically run tests when the page loads
      // window.addEventListener('DOMContentLoaded', runTests);
      // Or, let user click button. For now, button click is primary.
    </script>
  </body>
</html>
